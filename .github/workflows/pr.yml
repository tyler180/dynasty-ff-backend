name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: dynasty-ff-backend-dev

jobs:

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      terraform: ${{ steps.filter.outputs.terraform }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for Go changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            terraform:
              - 'terraform/**'
            image:
              - 'cmd/**'
              - 'config/**'
              - 'data/**'
              - 'docs/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'

    env:
      GOPRIVATE: github.com/tyler180/*

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure access to private Go modules
        env:
          GH_PRIVATE_REPOS_TOKEN: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PRIVATE_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_api_key: ${{ secrets.TF_VAR_API_KEY }}
      TF_VAR_fantasypros_api_key: ${{ secrets.TF_VAR_FANTASYPROS_API_KEY }}
      TF_VAR_username: ${{ secrets.TF_VAR_USERNAME }}
      TF_VAR_password: ${{ secrets.TF_VAR_PASSWORD }}
      TF_VAR_league_id: ${{ secrets.TF_VAR_LEAGUE_ID }}
      TF_VAR_franchise_id: ${{ secrets.TF_VAR_FRANCHISE_ID }}
    needs:
      - changes
      - go
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.image == 'true') &&
      (needs.go.result == 'success' || needs.go.result == 'skipped')
    permissions:
      contents: read
      actions: read
      id-token: write
    # defaults:
      # run:
      #   working-directory: terraform
    # environment:
    #   name: dev
    steps:

      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: dynasty-ff-backend

      - name: Checkout models
        uses: actions/checkout@v7
        with:
          repository: tyler180/dynasty-ff-models
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: dynasty-ff-models

      - name: Checkout read-only MFL MCP server
        uses: actions/checkout@v7
        with:
          repository: tyler180/mfl-mcp
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: mfl/mfl-mcp

      - name: Record dependency revisions
        run: |
          mkdir -p "${RUNNER_TEMP}/dev-plan"
          git -C dynasty-ff-models rev-parse HEAD > "${RUNNER_TEMP}/dev-plan/models-sha"
          git -C mfl/mfl-mcp rev-parse HEAD > "${RUNNER_TEMP}/dev-plan/mfl-mcp-sha"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::138013422358:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: dynasty-ff-backend/terraform

      - name: Terraform init
        run: terraform init
        working-directory: dynasty-ff-backend/terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: dynasty-ff-backend/terraform

      - name: Terraform plan
        run: terraform plan -out=${{ runner.temp }}/dev-plan/tfplan
        working-directory: dynasty-ff-backend/terraform

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v5
        with:
          name: dev-plan
          path: ${{ runner.temp }}/dev-plan/
          retention-days: 1
