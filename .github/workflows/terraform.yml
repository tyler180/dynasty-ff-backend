name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: dynasty-ff-backend-dev

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  go:
    name: Go
    runs-on: ubuntu-latest

    env:
      GOPRIVATE: github.com/tyler180/*

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure access to private Go modules
        env:
          GH_PRIVATE_REPOS_TOKEN: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PRIVATE_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_api_key: ${{ secrets.TF_VAR_API_KEY }}
      TF_VAR_username: ${{ secrets.TF_VAR_USERNAME }}
      TF_VAR_password: ${{ secrets.TF_VAR_PASSWORD }}
      TF_VAR_league_id: ${{ secrets.TF_VAR_LEAGUE_ID }}
      TF_VAR_franchise_id: ${{ secrets.TF_VAR_FRANCHISE_ID }}
    needs:
      - go
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dynasty-ff-backend/terraform
    # environment:
    #   name: dev
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          path: dynasty-ff-backend

      - name: Checkout models
        uses: actions/checkout@v7
        with:
          repository: tyler180/dynasty-ff-models
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: dynasty-ff-models

      - name: Checkout read-only MFL MCP server
        uses: actions/checkout@v7
        with:
          repository: tyler180/mfl-mcp
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: mfl/mfl-mcp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::138013422358:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        # if: github.event_name == 'pull_request'
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        # if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-plan
          path: dynasty-ff-backend/terraform/tfplan
          retention-days: 1

      - name: Download Plan Artifact
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: dev-plan
          path: dynasty-ff-backend/terraform
      - name: Terraform apply
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false tfplan
