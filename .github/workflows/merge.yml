name: PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: dynasty-ff-backend-dev

jobs:
  terraform:
    name: Terraform
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      TF_VAR_api_key: ${{ secrets.TF_VAR_API_KEY }}
      TF_VAR_fantasypros_api_key: ${{ secrets.TF_VAR_FANTASYPROS_API_KEY }}
      TF_VAR_username: ${{ secrets.TF_VAR_USERNAME }}
      TF_VAR_password: ${{ secrets.TF_VAR_PASSWORD }}
      TF_VAR_league_id: ${{ secrets.TF_VAR_LEAGUE_ID }}
      TF_VAR_franchise_id: ${{ secrets.TF_VAR_FRANCHISE_ID }}
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: dynasty-ff-backend

      - name: Find PR Check workflow run
        id: pr-run

        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          RUN_ID=$(gh run list \
          --repo="${{ github.repository }}" \
          --workflow=pr.yml \
          --commit="$PR_SHA" \
          --event=pull_request \
          --status=success \
          --limit=1 \
          --json databaseId \
          --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful PR Check workflow run found for commit $PR_SHA"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v5
        with:
          name: dev-plan
          path: ${{ runner.temp }}/dev-plan
          github-token: ${{ github.token }}
          run-id: ${{ steps.pr-run.outputs.run_id }}

      - name: Read dependency revisions
        id: read-revisions
        run: |
          echo "models_sha=$(cat "${RUNNER_TEMP}/dev-plan/models-sha")" >> "$GITHUB_OUTPUT"
          echo "mfl_mcp_sha=$(cat "${RUNNER_TEMP}/dev-plan/mfl-mcp-sha")" >> "$GITHUB_OUTPUT"

      - name: Checkout models
        uses: actions/checkout@v7
        with:
          repository: tyler180/dynasty-ff-models
          ref: ${{ steps.read-revisions.outputs.models_sha }}
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: dynasty-ff-models

      - name: Checkout read-only MFL MCP server
        uses: actions/checkout@v7
        with:
          repository: tyler180/mfl-mcp
          ref: ${{ steps.read-revisions.outputs.mfl_mcp_sha }}
          token: ${{ secrets.GH_PRIVATE_REPOS_TOKEN }}
          path: mfl/mfl-mcp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::138013422358:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: dynasty-ff-backend/terraform

      - name: Terraform init
        run: terraform init
        working-directory: dynasty-ff-backend/terraform

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false ${{ runner.temp }}/dev-plan/tfplan
        working-directory: dynasty-ff-backend/terraform
